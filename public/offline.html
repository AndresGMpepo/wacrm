<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#020617">
    <title>Sin conexión · Nexoomni</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #020617; color: #f8fafc; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; box-sizing: border-box; }
      main { max-width: 26rem; text-align: center; }
      img { width: 5rem; height: 5rem; margin-bottom: 1.25rem; }
      h1 { margin: 0 0 .75rem; font-size: 1.5rem; }
      p { margin: 0 0 1.5rem; color: #cbd5e1; line-height: 1.6; }
      button { border: 0; border-radius: .5rem; padding: .7rem 1rem; background: #16bd57; color: #061b45; font: inherit; font-weight: 650; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="">
      <h1>Sin conexión</h1>
      <p>Nexoomni necesita una conexión a internet para mostrar tus conversaciones. Vuelve a intentarlo cuando recuperes la conexión.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
